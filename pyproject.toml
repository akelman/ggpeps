[build-system]
# A list of packages that are needed to build your package:
requires = ["setuptools"]  # REQUIRED if [build-system] table is used
# The name of the Python object that frontends will use to perform the build:
build-backend = "setuptools.build_meta"  # If not defined, then legacy behavior can happen.


[project]
name = "ggpeps"  

version = "0.0.1"  
description = "A Python package to work with Gauged Gaussian Projected Entangled Pair States (GGPEPS)"
readme = "README.md"
requires-python = ">=3.8"

#license = {file = "LICENSE.txt"}

keywords = ["physics", "quantum physics", "simulation","tensor networks"]

# This should be your name or the name of the organization who originally
# authored the project, and a valid email address corresponding to the name
# listed.
authors = [
  {name = "Patrick Emonts", email = "emonts@lorentz.leidenuniv.nl" },
  {name = "Ariel Kelman", email = "ariel.kelman@mail.huji.ac.il" }
]

maintainers = [
  {name = "Patrick Emonts", email = "emonts@lorentz.leidenuniv.nl" },
  {name = "Ariel Kelman", email = "ariel.kelman@mail.huji.ac.il" }
]

classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Physics",
  "Topic :: Simulation",

  # Pick your license as you wish
  #TODO: Fix this
  "License :: OSI Approved :: MIT License",

  # Specify the Python versions you support here. In particular, ensure
  # that you indicate you support Python 3. These classifiers are *not*
  # checked by "pip install". See instead "requires-python" key in this file.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "tqdm",
  "numba",
  "matplotlib",
  "sympy",
  "pfapack",
  "jax",
  "jaxlib",
  "ray",
]

[project.optional-dependencies]
dev = ["check-manifest"]
test = ["coverage"]

